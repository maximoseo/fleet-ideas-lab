name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Smoke-run secrets: throwaway values for the CI boot only, never real ones.
      # NOTE: NODE_ENV stays UNSET here — setting it to production makes
      # `npm ci` skip devDependencies and typecheck dies on missing @types/node.
      DASHBOARD_AUTH_SECRET: ci-smoke-secret-0123456789abcdef0123456789
      DASHBOARD_AUTH_USERNAME: ci
      DASHBOARD_AUTH_PASSWORD: ci-smoke-password-not-real
      # The agent surface fails CLOSED: with no key configured its routes answer
      # 503, not 401. The auth-matrix smoke asserts every non-allowlisted route
      # returns exactly 401, so CI has been red since the agent surface landed —
      # a missing env value, not an open route. Give it a key and the routes
      # answer the way the check expects. Never a real one.
      AGENT_API_KEY: ci-smoke-agent-key-not-a-real-credential
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known-vulnerable runtime dependencies are a gate (next 16.3.1 carried three critical
      # advisories until 2026-10-04). Dev-only advisories do not block.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      # Lint is a real gate again as of 2026-08-17. The 28 errors are gone:
      # most were fixed, and the twelve remaining react-hooks
      # set-state-in-effect sites carry a targeted disable naming the reason.
      # New errors fail the build.
      - run: npm run lint
      - run: npm test
      # The served /api/app/version must match the Gradle build and the APK URL.
      - run: npm run check:version
      - run: npm run build
      - name: Boot production server
        run: |
          nohup npm start -- -p 3100 > /tmp/fil-server.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 -o /dev/null http://127.0.0.1:3100/login; then ok=1; echo up; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "server never came up"; cat /tmp/fil-server.log; exit 1; fi
      - name: Auth-matrix smoke
        run: node scripts/smoke-auth-matrix.mjs http://127.0.0.1:3100
